  <body>
    <hearder>
      <nav aria-label="Main Navigation">
        <a href="index.html" class="logo">First Project</a>

          <li><a href="index.html">Home</a></li>

    <main>
      <section>
        <h1>Contact Us</h1>
        <p>
          Have a question or feedback? Fill out the form below and we will get
          back to you as soon as possible.
        </p>
        <form actioion="#" method="post">
          <div class="form-group">
            <lable for="name">Full Name</lable>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="John Doe"
              required
            />
          </div>

          <div class="form-group">
            <lable for="email">Email Address</lable>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="john.doe@example.com"
              required
            />
          </div>

          <div class="form-group">
            <lable for="message">Message</lable>
            <textarea
              id="message"
              name="message"
              rows="5"
              placeholder="How can we help you?"
              required
            ></textarea>
          </div>

          <button type="submit">Send Message</button>
        </form>
      </section>
    </main>
